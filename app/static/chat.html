<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocAssist</title>
<style>
  /* Cores em variáveis: o tema escuro só troca os valores */
  :root {
    --fundo: #f6f5f2; --cartao: #ffffff; --texto: #1d1d1f; --suave: #6b6b70;
    --borda: #e2e0da; --destaque: #2f5d50; --destaque-texto: #ffffff;
    --pergunta: #e7efe9; --previa: #8a8a8f; --aviso: #8a5a00; --aviso-fundo: #fff4dc;
    --codigo: #f0eee9; --erro: #a23b2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #161618; --cartao: #1f1f22; --texto: #ececee; --suave: #9a9aa0;
      --borda: #333338; --destaque: #7fb8a4; --destaque-texto: #10221c;
      --pergunta: #24332d; --previa: #8a8a90; --aviso: #f0c46a; --aviso-fundo: #3a2f17;
      --codigo: #2a2a2e; --erro: #ff8a75;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--borda); background: var(--cartao);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--suave); font-size: 14px; flex: 1; min-width: 200px; }
  select, textarea, button { font: inherit; color: inherit; }
  select {
    background: var(--fundo); border: 1px solid var(--borda); border-radius: 8px; padding: 6px 8px;
  }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .conversa { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .vazio { text-align: center; color: var(--suave); margin-top: 8vh; }
  .vazio h2 { color: var(--texto); font-size: 20px; margin-bottom: 6px; }
  .exemplos { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; align-items: center; }
  .exemplos button {
    background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px;
    padding: 8px 14px; cursor: pointer; max-width: 100%;
  }
  .exemplos button:hover { border-color: var(--destaque); }
  .msg { border-radius: 12px; padding: 12px 14px; overflow-wrap: anywhere; }
  .msg.usuario { background: var(--pergunta); align-self: flex-end; max-width: 85%; white-space: pre-wrap; }
  .msg.assistente { background: var(--cartao); border: 1px solid var(--borda); }
  .status { color: var(--suave); font-style: italic; }
  .previa { color: var(--previa); }
  .resposta p { margin: 0 0 10px; }
  .resposta p:last-child { margin-bottom: 0; }
  .resposta ul, .resposta ol { margin: 0 0 10px; padding-left: 22px; }
  .resposta code { background: var(--codigo); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
  .resposta pre {
    background: var(--codigo); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 0 0 10px;
  }
  .resposta pre code { background: none; padding: 0; }
  sup.cit a { color: var(--destaque); text-decoration: none; font-weight: 600; padding: 0 1px; }
  .aviso {
    background: var(--aviso-fundo); color: var(--aviso); border-radius: 8px; padding: 8px 10px;
    margin-top: 10px; font-size: 14px;
  }
  .erro { color: var(--erro); }
  .fontes { margin-top: 12px; border-top: 1px solid var(--borda); padding-top: 10px; }
  .fontes h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin: 0 0 6px; }
  details { border: 1px solid var(--borda); border-radius: 8px; margin-bottom: 6px; }
  details.realce { border-color: var(--destaque); }
  summary { cursor: pointer; padding: 7px 10px; font-size: 14px; }
  summary .n { font-weight: 700; color: var(--destaque); margin-right: 6px; }
  .trecho {
    white-space: pre-wrap; font-size: 13px; color: var(--suave); padding: 0 10px 10px;
    max-height: 260px; overflow-y: auto;
  }
  .rodape {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;
    font-size: 13px; color: var(--suave);
  }
  .rodape .meta { flex: 1; min-width: 160px; }
  .voto {
    background: none; border: 1px solid var(--borda); border-radius: 8px; padding: 3px 9px; cursor: pointer;
  }
  .voto:hover, .voto.escolhido { border-color: var(--destaque); }
  .comentario { display: flex; gap: 6px; width: 100%; margin-top: 6px; }
  .comentario input {
    flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--fundo);
    border: 1px solid var(--borda); border-radius: 8px; padding: 5px 8px;
  }
  footer { border-top: 1px solid var(--borda); background: var(--cartao); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px;
    border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo);
  }
  .enviar {
    background: var(--destaque); color: var(--destaque-texto); border: 0; border-radius: 10px;
    padding: 10px 16px; cursor: pointer; font-weight: 600;
  }
  .enviar:disabled { opacity: .5; cursor: default; }
  .botao-chave {
    background: none; border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .botao-chave.ativa { border-color: var(--destaque); }
  .painel-chave {
    display: none; width: 100%; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px;
  }
  .painel-chave.aberto { display: flex; }
  .painel-chave input {
    flex: 1; min-width: 180px; font: inherit; color: inherit; background: var(--fundo);
    border: 1px solid var(--borda); border-radius: 8px; padding: 6px 8px;
  }
  .dica { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--suave); }
  @media (max-width: 560px) {
    header p { display: none; }
    header h1 { flex: 1; }
    main { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>DocAssist</h1>
  <p>Respostas com fontes sobre FastAPI, Docker Compose, PostgreSQL e Redis.</p>
  <label>Fonte:
    <select id="fonte"><option value="">todas</option></select>
  </label>
  <button type="button" class="botao-chave" id="botao-chave" title="Chave de acesso à API">🔑 Chave</button>
  <form class="painel-chave" id="painel-chave">
    <input id="chave" type="password" autocomplete="off" placeholder="Cole a chave de API (X-API-Key)">
    <button type="submit" class="voto">Salvar</button>
    <button type="button" class="voto" id="apagar-chave">Apagar</button>
    <span id="estado-chave"></span>
  </form>
</header>

<main id="rolagem">
  <div class="conversa" id="conversa">
    <div class="vazio" id="vazio">
      <h2>O que você quer saber?</h2>
      <div>Toda resposta cita os trechos da documentação em que se baseia.</div>
      <div class="exemplos">
        <button type="button">Como fazer o compose esperar o banco ficar pronto?</button>
        <button type="button">Qual a diferença entre RDB e AOF no Redis?</button>
        <button type="button">Como deixar um parâmetro de query opcional no FastAPI?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="formulario">
    <textarea id="pergunta" rows="1" maxlength="1000" placeholder="Faça uma pergunta…" required></textarea>
    <button class="enviar" id="enviar" type="submit">Enviar</button>
  </form>
  <div class="dica">Enter envia · Shift+Enter quebra a linha</div>
</footer>

<script>
// ---------- utilidades

const $ = (id) => document.getElementById(id);

// Todo texto que vem da API passa por aqui antes de virar HTML (evita injeção de HTML/JS)
function escapar(texto) {
  return texto.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

// Markdown mínimo: blocos de código, `código`, **negrito**, listas e parágrafos; [n] vira link para a fonte
function markdownParaHtml(texto, prefixo) {
  const partes = texto.split(/```[^\n]*\n?/);
  return partes.map((parte, i) => {
    if (i % 2 === 1) return `<pre><code>${escapar(parte.replace(/\n$/, ""))}</code></pre>`;
    return blocosDeTexto(parte, prefixo);
  }).join("");
}

function emLinha(texto, prefixo) {
  return escapar(texto)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[(\d+)\]/g, `<sup class="cit"><a href="#${prefixo}-$1" data-n="$1">$1</a></sup>`);
}

function blocosDeTexto(texto, prefixo) {
  const html = [];
  let lista = null;
  const fecharLista = () => { if (lista) { html.push(`</${lista}>`); lista = null; } };
  for (const linha of texto.split("\n")) {
    const item = linha.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if (item) {
      const tipo = /\d/.test(item[1]) ? "ol" : "ul";
      if (lista !== tipo) { fecharLista(); html.push(`<${tipo}>`); lista = tipo; }
      html.push(`<li>${emLinha(item[2], prefixo)}</li>`);
    } else if (linha.trim() === "") {
      fecharLista();
    } else {
      fecharLista();
      html.push(`<p>${emLinha(linha, prefixo)}</p>`);
    }
  }
  fecharLista();
  return html.join("");
}

// ---------- chave de API (guardada só neste navegador)

const LUGAR_DA_CHAVE = "docassist_chave";

function lerChave() {
  try { return localStorage.getItem(LUGAR_DA_CHAVE) || ""; } catch { return ""; }
}

function guardarChave(valor) {
  try {
    if (valor) localStorage.setItem(LUGAR_DA_CHAVE, valor);
    else localStorage.removeItem(LUGAR_DA_CHAVE);
  } catch { /* navegador sem armazenamento: a chave vale só até recarregar */ }
  chaveNaMemoria = valor;
  $("botao-chave").classList.toggle("ativa", Boolean(valor));
}

let chaveNaMemoria = lerChave();

// Todo pedido à API passa por aqui: põe o JSON e, se houver, a chave
function cabecalhos() {
  const h = { "Content-Type": "application/json" };
  if (chaveNaMemoria) h["X-API-Key"] = chaveNaMemoria;
  return h;
}

function mensagemDeErro(status, detalhe) {
  if (status === 401) return "Esta API pede uma chave de acesso. Clique em 🔑 Chave, no topo, e cole a sua.";
  return detalhe;
}

function rolarParaOFim() { $("rolagem").scrollTop = $("rolagem").scrollHeight; }

// ---------- Server-Sent Events lidos de um POST
// O EventSource do navegador só faz GET; com POST, lemos o corpo aos pedaços com fetch.

function lerEvento(bloco) {
  let evento = "message";
  const dados = [];
  for (const linha of bloco.split("\n")) {
    if (linha.startsWith("event:")) evento = linha.slice(6).trim();
    else if (linha.startsWith("data:")) dados.push(linha.slice(5).trim());
  }
  return { evento, dados: dados.length ? JSON.parse(dados.join("\n")) : null };
}

async function* eventosDoStream(resposta) {
  const leitor = resposta.body.getReader();
  const decodificador = new TextDecoder();
  let guardado = "";
  while (true) {
    const { value, done } = await leitor.read();
    if (done) break;
    guardado += decodificador.decode(value, { stream: true });
    let fim;
    while ((fim = guardado.indexOf("\n\n")) !== -1) {  // uma linha vazia fecha cada evento
      const bloco = guardado.slice(0, fim);
      guardado = guardado.slice(fim + 2);
      if (bloco.trim()) yield lerEvento(bloco);
    }
  }
}

// ---------- mensagens na tela

let contador = 0;

function adicionarPergunta(texto) {
  $("vazio")?.remove();
  const div = document.createElement("div");
  div.className = "msg usuario";
  div.textContent = texto;
  $("conversa").appendChild(div);
}

function adicionarResposta() {
  const div = document.createElement("div");
  div.className = "msg assistente";
  div.innerHTML = '<div class="resposta"><span class="status">Procurando nos documentos…</span></div>';
  $("conversa").appendChild(div);
  rolarParaOFim();
  return div;
}

function mostrarPrevia(div, texto, prefixo) {
  div.querySelector(".resposta").innerHTML = `<div class="previa">${markdownParaHtml(texto, prefixo)}</div>`;
  rolarParaOFim();
}

function mostrarFinal(div, dados, prefixo) {
  const partes = [`<div class="resposta">${markdownParaHtml(dados.resposta, prefixo)}</div>`];
  if (dados.aviso) partes.push(`<div class="aviso">${escapar(dados.aviso)}</div>`);
  if (dados.citacoes.length) {
    const titulo = dados.encontrou_resposta ? "Fontes" : "Trechos mais próximos";
    partes.push(`<div class="fontes"><h3>${titulo}</h3>`);
    for (const c of dados.citacoes) {
      const nota = c.nota_reranker != null ? `nota ${c.nota_reranker}` : `distância ${c.distancia}`;
      partes.push(
        `<details id="${prefixo}-${c.n}"><summary><span class="n">[${c.n}]</span>` +
        `${escapar(c.secao || c.doc_id || "")} <small>· ${nota}</small></summary>` +
        `<div class="trecho">${escapar(c.trecho)}</div></details>`
      );
    }
    partes.push("</div>");
  }
  const m = dados.meta;
  const tempo = (m.latencia_ms / 1000).toFixed(1).replace(".", ",");
  const origem = m.cache ? "do cache" : (m.modelo || "sem LLM");
  partes.push(`<div class="rodape"><span class="meta">${escapar(origem)} · ${tempo} s</span></div>`);
  div.innerHTML = partes.join("");

  // Clicar em [n] abre e destaca a fonte
  div.querySelectorAll("sup.cit a").forEach((link) => link.addEventListener("click", () => {
    const fonte = document.getElementById(link.getAttribute("href").slice(1));
    if (!fonte) return;
    fonte.open = true;
    fonte.classList.add("realce");
    setTimeout(() => fonte.classList.remove("realce"), 1500);
  }));

  if (dados.interacao_id) adicionarVotos(div.querySelector(".rodape"), dados.interacao_id);
  rolarParaOFim();
}

// ---------- feedback 👍/👎

async function votar(interacaoId, util, comentario) {
  const resposta = await fetch("/rag/feedback", {
    method: "POST",
    headers: cabecalhos(),
    body: JSON.stringify({ interacao_id: interacaoId, util, comentario: comentario || null }),
  });
  return resposta.ok;
}

function adicionarVotos(rodape, interacaoId) {
  const sim = Object.assign(document.createElement("button"), { className: "voto", textContent: "👍", title: "Ajudou" });
  const nao = Object.assign(document.createElement("button"), { className: "voto", textContent: "👎", title: "Não ajudou" });
  const obrigado = document.createElement("span");
  rodape.append(sim, nao, obrigado);

  sim.addEventListener("click", async () => {
    if (await votar(interacaoId, true)) {
      sim.classList.add("escolhido"); nao.classList.remove("escolhido");
      rodape.querySelector(".comentario")?.remove();
      obrigado.textContent = "Obrigado!";
    }
  });

  nao.addEventListener("click", async () => {
    if (!(await votar(interacaoId, false))) return;
    nao.classList.add("escolhido"); sim.classList.remove("escolhido");
    obrigado.textContent = "Registrado.";
    if (rodape.querySelector(".comentario")) return;
    const caixa = document.createElement("form");
    caixa.className = "comentario";
    caixa.innerHTML = '<input maxlength="500" placeholder="O que faltou ou estava errado? (opcional)"><button class="voto" type="submit">Enviar</button>';
    caixa.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const texto = caixa.querySelector("input").value.trim();
      if (texto && (await votar(interacaoId, false, texto))) {
        caixa.remove();
        obrigado.textContent = "Obrigado pelo comentário!";
      }
    });
    rodape.appendChild(caixa);
    caixa.querySelector("input").focus();
  });
}

// ---------- enviar a pergunta

async function perguntar(texto) {
  const prefixo = `r${++contador}`;
  adicionarPergunta(texto);
  const div = adicionarResposta();
  $("enviar").disabled = true;

  const corpo = { pergunta: texto };
  if ($("fonte").value) corpo.fonte = $("fonte").value;

  try {
    const resposta = await fetch("/rag/ask/stream", {
      method: "POST",
      headers: cabecalhos(),
      body: JSON.stringify(corpo),
    });
    if (!resposta.ok) {
      const erro = await resposta.json().catch(() => ({}));
      const detalhe = typeof erro.detail === "string" ? erro.detail : `erro HTTP ${resposta.status}`;
      const texto = mensagemDeErro(resposta.status, detalhe);
      div.innerHTML = `<span class="erro">Não foi possível responder: ${escapar(texto)}</span>`;
      return;
    }
    let previa = "";
    for await (const { evento, dados } of eventosDoStream(resposta)) {
      if (evento === "parcial") {
        previa += dados.texto;
        mostrarPrevia(div, previa, prefixo);
      } else if (evento === "fim") {
        mostrarFinal(div, dados, prefixo);
      } else if (evento === "erro") {
        div.innerHTML = `<span class="erro">${escapar(dados.detalhe)}</span>`;
      }
    }
  } catch (erro) {
    div.innerHTML = `<span class="erro">Sem conexão com a API (${escapar(String(erro))}).</span>`;
  } finally {
    $("enviar").disabled = false;
    $("pergunta").focus();
  }
}

$("formulario").addEventListener("submit", (evento) => {
  evento.preventDefault();
  const texto = $("pergunta").value.trim();
  if (!texto || $("enviar").disabled) return;
  $("pergunta").value = "";
  $("pergunta").style.height = "";
  perguntar(texto);
});

$("pergunta").addEventListener("keydown", (evento) => {
  if (evento.key === "Enter" && !evento.shiftKey) {
    evento.preventDefault();
    $("formulario").requestSubmit();
  }
});

$("pergunta").addEventListener("input", (evento) => {  // a caixa cresce com o texto
  evento.target.style.height = "";
  evento.target.style.height = `${evento.target.scrollHeight}px`;
});

document.querySelectorAll(".exemplos button").forEach((botao) =>
  botao.addEventListener("click", () => perguntar(botao.textContent))
);

$("botao-chave").classList.toggle("ativa", Boolean(chaveNaMemoria));
$("botao-chave").addEventListener("click", () => {
  $("painel-chave").classList.toggle("aberto");
  $("chave").value = chaveNaMemoria;
  $("estado-chave").textContent = chaveNaMemoria ? "Há uma chave salva." : "";
  $("chave").focus();
});
$("painel-chave").addEventListener("submit", (evento) => {
  evento.preventDefault();
  guardarChave($("chave").value.trim());
  $("estado-chave").textContent = chaveNaMemoria ? "Chave salva neste navegador." : "";
});
$("apagar-chave").addEventListener("click", () => {
  guardarChave("");
  $("chave").value = "";
  $("estado-chave").textContent = "Chave apagada.";
});

// As fontes do filtro vêm dos documentos indexados
fetch("/rag/documents")
  .then((r) => (r.ok ? r.json() : { documentos: [] }))
  .then(({ documentos }) => {
    const fontes = [...new Set(documentos.map((d) => d.fonte).filter(Boolean))].sort();
    for (const fonte of fontes) $("fonte").add(new Option(fonte, fonte));
  })
  .catch(() => {});
</script>
</body>
</html>
